<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FDFDFB" />

    <title>Mens Helper — Autocuidado masculino sem frescura, em 10 minutos por dia</title>
    <meta
      name="description"
      content="O guia direto ao ponto para o homem que quer cuidar da pele, do corpo e da cabeça sem virar outra pessoa. Rotina de 10 minutos por dia, do jeito simples."
    />

    <!-- Open Graph / compartilhamento -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Mens Helper" />
    <meta property="og:title" content="Mens Helper — Autocuidado masculino sem frescura" />
    <meta
      property="og:description"
      content="Pele, barba, corpo e cabeça sob controle em 10 minutos por dia. Sem produto caro, sem papo de revista."
    />
    <!-- TODO: trocar pela URL final do site e por uma imagem 1200x630 real -->
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Primeira imagem do fundo do herói: é o maior elemento acima da dobra,
         então vale pedir cedo. As outras duas do slideshow entram depois. -->
    <link
      rel="preload"
      as="image"
      href="/hero/hero-1.webp"
      imagesrcset="/hero/hero-1-960.webp 960w, /hero/hero-1.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Fontes: carregadas com display=swap para não bloquear a renderização -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--

  </body>
</html>
